name: Self-Hosted Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  runner-test:
    name: Test AWS EC2 Runner

    runs-on: self-hosted

    steps:
      - name: Install Git if missing
        shell: bash
        run: |
          if ! command -v git >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y git
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y git
            elif command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git
            else
              echo "Git is missing and no supported package manager was found."
              exit 1
            fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Welcome Message
        run: echo "Hello DevOps! My self-hosted runner is working."

      - name: Check Operating System
        run: uname -a

      - name: Check Git Version
        run: git --version

      - name: Display Hostname
        run: hostname

      - name: Display Current Date
        run: date

      - name: Success Message
        run: echo "GitHub Actions executed successfully on AWS EC2!"
